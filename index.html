<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LCKH KUA Cipeundeuy</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #087443;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            font-size: 24px;
            margin-bottom: 6px;
        }

        header p {
            font-size: 14px;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .welcome {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            text-align: center;
        }

        .welcome h2 {
            color: #087443;
            margin-bottom: 12px;
        }

        .welcome p {
            color: #555;
            line-height: 1.6;
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            text-align: center;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <header>
        <h1>LCKH KUA Cipeundeuy</h1>
        <p>Laporan Capaian Kinerja Harian</p>
    </header>

    <main>
        <section class="welcome">
            <h2>Selamat Datang</h2>
            <p>
                Sistem Laporan Capaian Kinerja Harian
                Kantor Urusan Agama Cipeundeuy.
            </p>
        </section>
    </main>

    <footer>
        © 2026 KUA Cipeundeuy
    </footer>

</body>
